---
services:

  rustfs:
    image: rustfs/rustfs:${RUSTFS_IMAGE_TAG:-latest}
    container_name: ${RUSTFS_NAME_PREFIX}rustfs
    restart: unless-stopped
    command: /data
    ports:
      - "9990:9000"
      - "9991:9001"
    volumes:
      - ${RUSTFS_STORAGE_PATH}:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS}
    network_mode: bridge
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


